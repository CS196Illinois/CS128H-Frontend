<div class="shell">
  <app-sidebar [open]="navOpen" (navigate)="navOpen = false"></app-sidebar>

  <div class="content">
    <header class="mobile-bar">
      <a routerLink="/" class="mobile-brand" (click)="navOpen = false">
        <img src="assets/logo.png" alt="" />
        <span>CS 128 Honors</span>
      </a>
      <button class="mobile-toggle" (click)="navOpen = !navOpen" [attr.aria-expanded]="navOpen" aria-label="Menu">
        {{ navOpen ? "Close" : "Menu" }}
      </button>
    </header>

    <router-outlet></router-outlet>
  </div>
</div>
