<div class="page">
  <h1 class="page-title">Hall of Fame</h1>
  <p class="page-intro">
    This is where we immortalize the best student projects from past semesters. Create awesome projects in this
    course, and this could be you this semester.
  </p>
  @for (hof of hofs; track hof.group) {
    <article class="project">
      <div class="head">
        <h2>{{ hof.group }}</h2>
        <a [href]="hof.github" target="_blank" rel="noopener noreferrer">GitHub</a>
        @if (hof.live) {
          <a [href]="hof.live" target="_blank" rel="noopener noreferrer">Live site</a>
        }
      </div>
      <p>{{ hof.description }}</p>
    </article>
  }
</div>
