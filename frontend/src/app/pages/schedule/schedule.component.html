<div class="page">
  <h1 class="page-title">Schedule</h1>
  @for (w of weeks; track w.label) {
    <section class="week" [class.now]="w.isNow">
      <div class="week-label">
        <div class="name">{{ w.label }}</div>
        <div class="start">Week of {{ w.startLabel }}</div>
        @if (w.isNow) {
          <div class="badge">This week</div>
        }
      </div>
      <div class="items">
        @for (it of w.items; track $index) {
          <div class="item" [class.past]="it.past">
            <span class="type">{{ it.type }}</span>
            <span class="item-name">{{ it.name }}</span>
            <span class="when">{{ it.dateLabel }}</span>
          </div>
        }
      </div>
    </section>
  }
</div>
